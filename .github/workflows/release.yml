name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # Publishing to homebrew-tap and scoop-bucket needs cross-repository
          # write access. Skip it when that secret is not configured so the
          # release still produces its binaries.
          SKIP_TAP_UPLOAD: ${{ secrets.TAP_GITHUB_TOKEN == '' && 'true' || 'false' }}
